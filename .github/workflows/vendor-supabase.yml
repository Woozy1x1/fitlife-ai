name: Supabase-Bibliothek lokal ablegen

# Laedt die Supabase-JS-Bibliothek einmalig herunter, prueft die
# Pruefsumme und legt sie im Repository ab. So muss die App sie
# nicht bei jedem Aufruf von einem fremden Server (esm.sh) laden.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vendor-supabase.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Datei laden und Pruefsumme pruefen
        run: |
          mkdir -p vendor
          curl -fsSL "https://esm.sh/@supabase/supabase-js@2.119.2/es2022/supabase-js.bundle.mjs" -o vendor/supabase-js-2.119.2.js
          echo "c86288d8be2599500e7ad53ddf2b8f9d26ee9f39a0337fb0da5608a2adacb121  vendor/supabase-js-2.119.2.js" | sha256sum -c -

      - name: Datei committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase-js-2.119.2.js
          git diff --cached --quiet || git commit -m "Supabase-Bibliothek 2.119.2 lokal abgelegt"
          git push
