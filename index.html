
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VYORA AI – Dein Gesundheitsdashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    main {
      max-width: 480px;
      margin: 50px auto;
    }

    h1 {
      color: #4ade80;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .card {
      background: #172338;
      border: 1px solid #30415a;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 18px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 15px;
    }

    input {
      background: #0b1220;
      border: 1px solid #475569;
      color: white;
    }

    button {
      border: none;
      background: #4ade80;
      color: #082013;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      background: #334155;
      color: white;
    }

    .hidden { display: none; }

    .success { color: #4ade80; }
    .muted { color: #94a3b8; }

    #message {
      color: #facc15;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 16px;
    }

    #sleepResult {
      margin-top: 16px;
      padding: 14px;
      background: #0b1220;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      margin-top: 30px;
    }

    footer a {
      color: #94a3b8;
      margin: 0 7px;
    }
  </style>
</head>

<body>
<main>
  <h1>VYORA AI</h1>

  <p class="subtitle">
    Dein intelligenter Begleiter für Schlaf,
    Fitness und Gesundheit.
  </p>

  <section id="authCard" class="card">
    <h2>Willkommen</h2>
    <p>Melde dich an oder erstelle dein kostenloses Konto.</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="E-Mail-Adresse"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Passwort"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button type="submit">Anmelden</button>
    </form>

    <button id="registerButton" class="secondary">
      Neues Konto erstellen
    </button>
  </section>

  <section id="dashboard" class="card hidden">
    <h2>Dein Dashboard</h2>

    <p>Angemeldet als:</p>
    <p id="userEmail"></p>

    <h3>Oura Ring</h3>

    <p id="ouraStatus" class="muted">
      Verbindungsstatus wird geprüft ...
    </p>

    <button id="ouraButton" class="hidden">
      Oura Ring verbinden
    </button>

    <button id="sleepButton" class="secondary hidden">
      Schlafdaten abrufen
    </button>

    <div id="sleepResult" class="hidden" role="status"></div>

    <button id="logoutButton" class="secondary">
      Abmelden
    </button>
  </section>

  <p id="message" role="status" aria-live="polite"></p>

  <footer>
    <a href="datenschutz.html">Datenschutz</a>
    <a href="impressum.html">Impressum</a>
    <a href="nutzungsbedingungen.html">
      Nutzungsbedingungen
    </a>
  </footer>
</main>

<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL =
    "https://uukjvrmxrxbhueqarjpp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_PsUKAdDVjsQ3MAmCAFqKvg_1lo8yljP";

  const OURA_FUNCTION =
    SUPABASE_URL + "/functions/v1/oura-connect";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = (id) => document.getElementById(id);

  const authCard = $("authCard");
  const dashboard = $("dashboard");
  const userEmail = $("userEmail");
  const ouraStatus = $("ouraStatus");
  const ouraButton = $("ouraButton");
  const sleepButton = $("sleepButton");
  const sleepResult = $("sleepResult");

  let currentUserId = null;
  let refreshCounter = 0;

  function showMessage(text) {
    $("message").textContent = text;
  }

  function showConnection(connected) {
    ouraButton.classList.remove("hidden");

    if (connected) {
      ouraStatus.textContent = "✓ Oura Ring verbunden";
      ouraStatus.className = "success";

      ouraButton.textContent = "Oura Ring erneut verbinden";
      sleepButton.classList.remove("hidden");
    } else {
      ouraStatus.textContent = "Oura Ring nicht verbunden";
      ouraStatus.className = "muted";

      ouraButton.textContent = "Oura Ring verbinden";
      sleepButton.classList.add("hidden");
      sleepResult.classList.add("hidden");
    }
  }

  function showChecking() {
    ouraStatus.textContent =
      "Oura-Verbindung wird geprüft ...";

    ouraStatus.className = "muted";
    ouraButton.classList.add("hidden");
    sleepButton.classList.add("hidden");
  }

  async function authenticatedRequest(action) {
    const { data, error } =
      await supabase.auth.getSession();

    if (error || !data.session) {
      throw new Error("Bitte erneut anmelden.");
    }

    const response = await fetch(
      OURA_FUNCTION +
      "?action=" +
      encodeURIComponent(action),
      {
        method: "POST",
        headers: {
          Authorization:
            "Bearer " + data.session.access_token,
          apikey: SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({})
      }
    );

    let result;

    try {
      result = await response.json();
    } catch {
      throw new Error("Ungültige Serverantwort.");
    }

    if (!response.ok) {
      throw new Error(
        result.error ||
        "Serverfehler (HTTP " + response.status + ")"
      );
    }

    return result;
  }

  async function checkOuraStatus(userId, counter) {
    showChecking();

    try {
      const result = await authenticatedRequest("status");

      if (
        currentUserId !== userId ||
        refreshCounter !== counter
      ) {
        return;
      }

      showConnection(result.connected === true);

    } catch (error) {
      if (
        currentUserId !== userId ||
        refreshCounter !== counter
      ) {
        return;
      }

      ouraStatus.textContent =
        "Verbindungsstatus konnte nicht geprüft werden.";

      ouraStatus.className = "muted";
      ouraButton.classList.remove("hidden");
      ouraButton.textContent = "Oura Ring verbinden";

      showMessage(
        "Statusabfrage fehlgeschlagen: " + error.message
      );
    }
  }

  async function refreshUI() {
    const counter = ++refreshCounter;

    const { data, error } =
      await supabase.auth.getUser();

    if (counter !== refreshCounter) return;

    const user = data?.user;

    if (error && error.name !== "AuthSessionMissingError") {
      showMessage(error.message);
    }

    authCard.classList.toggle("hidden", !!user);
    dashboard.classList.toggle("hidden", !user);
    userEmail.textContent = user?.email || "";

    if (!user) {
      currentUserId = null;
      return;
    }

    currentUserId = user.id;

    const params = new URLSearchParams(
      window.location.search
    );

    const ouraResult = params.get("oura");

    if (ouraResult === "connected") {
      showMessage(
        "Oura-Autorisierung erfolgreich abgeschlossen."
      );
    } else if (ouraResult === "denied") {
      showMessage("Oura-Freigabe abgebrochen.");
    }

    if (ouraResult !== null) {
      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete("oura");

      window.history.replaceState(
        {},
        "",
        cleanUrl.toString()
      );
    }

    await checkOuraStatus(user.id, counter);
  }

  $("loginForm").addEventListener(
    "submit",
    async (event) => {
      event.preventDefault();

      const email = $("email").value.trim();
      const password = $("password").value;

      const { error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        showMessage(
          "Anmeldung fehlgeschlagen: " + error.message
        );
        return;
      }

      showMessage("Erfolgreich angemeldet.");
      await refreshUI();
    }
  );

  $("registerButton").addEventListener(
    "click",
    async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || password.length < 6) {
        showMessage(
          "Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben."
        );
        return;
      }

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo:
            "https://woozy1x1.github.io/fitlife-ai/"
        }
      });

      showMessage(
        error
          ? "Registrierung fehlgeschlagen: " + error.message
          : "Registrierung gestartet. Bitte prüfe deine E-Mails."
      );

      await refreshUI();
    }
  );

  $("logoutButton").addEventListener(
    "click",
    async () => {
      const { error } = await supabase.auth.signOut();

      if (error) {
        showMessage(error.message);
        return;
      }

      currentUserId = null;
      showMessage("Erfolgreich abgemeldet.");
      await refreshUI();
    }
  );

  ouraButton.addEventListener(
    "click",
    async () => {
      ouraButton.disabled = true;

      try {
        showMessage(
          "Oura-Verbindung wird gestartet ..."
        );

        const result =
          await authenticatedRequest("start");

        const target =
          result.url || result.authorization_url;

        if (!target) {
          throw new Error(
            "Keine Oura-Weiterleitungsadresse erhalten."
          );
        }

        const url = new URL(target);

        if (
          url.protocol !== "https:" ||
          url.hostname !== "cloud.ouraring.com"
        ) {
          throw new Error(
            "Unerwartete Oura-Weiterleitungsadresse."
          );
        }

        window.location.assign(url.href);

      } catch (error) {
        showMessage(error.message);
      } finally {
        ouraButton.disabled = false;
      }
    }
  );

  sleepButton.addEventListener(
    "click",
    async () => {
      sleepButton.disabled = true;

      sleepResult.classList.remove("hidden");
      sleepResult.textContent =
        "Schlafdaten werden geladen ...";

      try {
        const result =
          await authenticatedRequest("daily");

        const entries =
          Array.isArray(result.data)
            ? result.data
            : [];

        if (entries.length === 0) {
          sleepResult.textContent =
            "Keine Schlafdaten für die letzten 7 Tage verfügbar.";
        } else {
          const lines = entries.map((item) => {
            const date = item.day || "Unbekanntes Datum";
            const score = item.score ?? "Kein Wert";

            return (
              date + " – Schlafscore: " + score
            );
          });

          sleepResult.textContent = lines.join("\n");
        }

        showMessage("Schlafdaten erfolgreich abgerufen.");

      } catch (error) {
        sleepResult.textContent =
          "Fehler: " + error.message;

        showMessage(
          "Schlafdaten konnten nicht geladen werden."
        );

      } finally {
        sleepButton.disabled = false;
      }
    }
  );

  supabase.auth.onAuthStateChange(() => {
    setTimeout(() => {
      refreshUI();
    }, 0);
  });

  refreshUI();
</script>
</body>
</html>
